[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-wedge"
version = "0.1.0"
description = "Pistola Serial: teclea en la ventana activa los códigos de un lector de barras serial"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "pystray>=0.19", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
serial-wedge = "serial_wedge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
serial_wedge = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
